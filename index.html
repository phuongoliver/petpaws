<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws and Pause</title>

    <meta name="description" content="A Pomodoro app with a virtual pet.">
    <meta name="theme-color" content="#FFD54F">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Bokeh Background Area -->
    <div class="background-decor">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Main Dashboard View Container -->
    <main id="main-view" style="display: none;">
        <!-- Top App Header -->
        <header class="app-header">
            <!-- Left: Resources & Shop -->
            <div class="resources-wrapper" style="display: flex; gap: 10px; align-items: center;">
                <div class="resources">
                    <div class="resource-item" title="Bones">
                        <span>🦴</span> <span id="bone-count">0</span>
                    </div>
                    <div class="resource-item" title="Coins">
                        <span>🪙</span> <span id="coin-count">0</span>
                    </div>
                </div>
                <button id="shop-btn" class="shop-btn" title="Collection & Shop">🏪</button>
            </div>

            <!-- Middle: My Pet -->
            <div class="pet-btn-wrapper">
                <button id="pet-dashboard-btn" class="my-pet-btn" title="My Pet">🐾</button>
            </div>

            <!-- Right: Logout -->
            <div class="logout-wrapper">
                <button id="logout-btn" class="logout-btn" title="Logout">🚪</button>
            </div>
        </header>

        <!-- Top: Timer Section -->
        <div class="timer-section">
            <h1 id="timer-display">25:00</h1>

            <div id="slider-container">
                <input type="range" id="focus-duration" min="5" max="120" step="5" value="25">
                <div id="duration-label">25 min</div>
            </div>
        </div>

        <!-- Center: The Dog -->
        <div class="pet-section" id="pet-area" style="position: relative;">
            <!-- Mini Hunger Bar -->
            <div id="mini-hunger-container"
                style="position: absolute; top: 10px; width: 100px; height: 10px; background: var(--border-color); border-radius: 5px; overflow: hidden; display: flex;">
                <div id="mini-hunger-bar" style="width: 50%; background: #ff9800; transition: width 0.3s;"></div>
            </div>

            <!-- Rendered via Canvas to match Dart exact shapes and curves -->
            <canvas id="dog-canvas" width="280" height="280"></canvas>
        </div>

        <!-- Bottom: Controls & Room -->
        <div class="controls-section">
            <div class="timer-controls">
                <button id="main-btn" class="btn primary">START FOCUS</button>
                <button id="feed-btn" class="btn secondary" title="Feed (+20 Hunger)" disabled>FEED 🍗</button>
            </div>

            <div class="room-container" id="room-container">
                <div class="room-inputs">
                    <input type="text" id="room-id-input" placeholder="Room ID..." class="room-input">
                    <button id="join-room-btn" class="btn small primary">Vào</button>
                    <button id="create-room-btn" class="btn small secondary">Tạo</button>
                    <button id="leave-room-btn" class="btn small secondary" style="display: none;">Rời</button>
                </div>
                <div id="room-display" class="room-display" style="display: none;"></div>
                <div id="room-status" class="room-status"></div>
            </div>
        </div>
    </main>

    <!-- Onboarding View Container -->
    <div id="onboarding-view" class="onboarding-container" style="display: none;">
        <h1 class="onboard-title">Choose Your Companion</h1>

        <div class="pet-carousel">
            <!-- Dog -->
            <div class="pet-card" data-pet-id="dog_01">
                <div class="pet-icon">🐶</div>
                <h3>Golden Doggo</h3>
                <p>Loyal & Energetic</p>
            </div>

            <!-- Cat -->
            <div class="pet-card" data-pet-id="cat_01">
                <div class="pet-icon">🐱</div>
                <h3>Sleepy Kitty</h3>
                <p>Calm & Quiet</p>
            </div>

            <!-- Bird -->
            <div class="pet-card" data-pet-id="bird_01">
                <div class="pet-icon">🦜</div>
                <h3>Chatty Parrot</h3>
                <p>Loud & Fun</p>
            </div>
        </div>

        <div class="naming-section">
            <input type="text" id="pet-name-input" class="minimal-input" placeholder="Name your pet..." maxlength="15">
        </div>

        <button id="adopt-btn" class="btn primary cta-btn" disabled>Adopt</button>
    </div>

    <!-- Pet Status Dashboard (Modal) -->
    <div id="pet-dashboard-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content bottom-sheet">
            <button id="close-dashboard-btn" class="close-btn">&times;</button>
            <div class="dashboard-header">
                <div class="dashboard-avatar-wrap">
                    <div id="dashboard-pet-avatar" class="dashboard-avatar">🐶</div>
                    <div id="dashboard-pet-level" class="level-badge">1</div>
                </div>
                <h2 id="dashboard-pet-name">Mochi</h2>
                <p id="dashboard-pet-stage">Baby Stage</p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-row">
                    <span class="stat-label">🌟 EXP</span>
                    <div class="progress-bar-container">
                        <div id="exp-bar" class="progress-bar exp-color" style="width: 0%;"></div>
                    </div>
                    <span id="exp-text" class="stat-text">0 / 100</span>
                </div>

                <div class="stat-row">
                    <span class="stat-label">🍖 Năng lượng</span>
                    <div class="progress-bar-container">
                        <div id="hunger-bar" class="progress-bar hunger-color" style="width: 100%;"></div>
                    </div>
                    <span id="hunger-text" class="stat-text">100/100</span>
                </div>

                <div class="stat-row">
                    <span class="stat-label">❤️ Tình cảm</span>
                    <div class="progress-bar-container">
                        <div id="bond-bar" class="progress-bar bond-color" style="width: 50%;"></div>
                    </div>
                    <span id="bond-text" class="stat-text">50/100</span>
                </div>
            </div>

            <div class="dashboard-actions">
                <button id="dashboard-feed-btn" class="btn secondary full-width">Feed (+20 Hunger) 🦴 1</button>
            </div>
        </div>
    </div>

    <!-- Auth View Container -->
    <div id="auth-view" class="auth-container">
        <h1 class="app-title">Paws & Pause</h1>
        <div class="auth-card">
            <h2 id="auth-title">Đăng nhập</h2>

            <form id="auth-form">
                <div class="input-group">
                    <label for="username">Tên người dùng</label>
                    <input type="text" id="username" required placeholder="Nhập tên của bạn">
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" required placeholder="Nhập mật khẩu">
                </div>

                <p id="auth-error" class="error-msg"></p>

                <button type="submit" id="auth-submit-btn" class="btn primary full-width">Vào ngay</button>
            </form>

            <div class="auth-switch">
                <span id="auth-switch-text">Chưa có tài khoản?</span>
                <button id="auth-switch-btn" type="button">Đăng ký ngay</button>
            </div>
        </div>
    </div>

    <!-- Pet Collection Modal -->
    <div id="collection-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content collection-box">
            <button id="close-collection-btn" class="close-btn">&times;</button>
            <h2 class="collection-title">My Collection</h2>

            <!-- Tabs for future expansion (Items vs Stages) -->
            <div class="collection-tabs">
                <button class="tab-btn active" data-tab="stages">Stages</button>
                <button class="tab-btn" data-tab="items">Items (Shop)</button>
            </div>

            <!-- Grid for stages -->
            <div id="collection-grid" class="collection-grid">
                <!-- Dynamically populated by JS -->
            </div>
        </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log("Service Worker Registered"));
        }
    </script>
    <!-- Supabase CDN (Put this before main.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
